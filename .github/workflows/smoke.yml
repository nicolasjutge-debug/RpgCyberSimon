name: smoke-test
on: [pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install project deps
        working-directory: Vr/fortnite
        run: |
          npm ci || npm install

      - name: Install Playwright browsers & system deps
        uses: microsoft/playwright-github-action@v1
        with:
          browsers: 'chromium'

      - name: Start static server
        working-directory: Vr/fortnite
        run: npx http-server -p 8080 & sleep 2

      - name: Run smoke script via Playwright
        run: node .github/scripts/run_smoke.js
