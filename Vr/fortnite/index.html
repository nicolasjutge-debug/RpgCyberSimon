<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberQuest — Battle Isle (Fortnite-style) </title>
<link rel="icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0f1724; --accent:#5dd3ff; --accent2:#ff66c4; --panel:#0b1220; --muted:#98a8b7; --success:#27e0a0; --danger:#ff5b6e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#071022);color:#e6fbff;font-family:Inter,ui-sans-serif,system-ui,monospace;overflow:hidden}
canvas{display:block}
/* Top HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;padding:10px 16px;pointer-events:none}
.hud .left,.hud .right{display:flex;gap:10px;align-items:center}
.hud .panel{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);backdrop-filter:blur(6px);padding:8px 12px;border-radius:8px;font-family:monospace;font-size:13px}
.logo{font-weight:800;color:var(--accent);letter-spacing:1px}
.logo span{color:var(--accent2)}
/* HUD bottom */
.hudBottom{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:20;display:flex;gap:12px;pointer-events:none}
.hudBottom .btn{pointer-events:auto;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#071322;padding:10px 16px;border-radius:24px;font-weight:800;border:none;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5)}
/* HUD bars */
.hbar{width:220px;height:16px;border-radius:12px;background:rgba(255,255,255,0.04);overflow:hidden;border:1px solid rgba(255,255,255,0.03)}
.hbar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--success));width:100%}
.small{font-size:12px;color:var(--muted)}
/* Mini-map */
.minimap{width:140px;height:80px;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#071022,#06121b);border:1px solid rgba(255,255,255,0.03)}
/* Loading */
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:linear-gradient(180deg,#071022,#020612);}
.loadBox{padding:20px;border-radius:12px;background:rgba(255,255,255,0.02);text-align:center}
/* VR toggle */
.vrToggle{position:fixed;left:18px;bottom:18px;z-index:20;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.03);pointer-events:auto}
.vrToggle button{background:transparent;border:0;color:var(--muted);cursor:pointer;font-weight:700}
/* Mobile adjustments */
@media (max-width:600px){.hbar{width:160px}.hudBottom{flex-direction:column}}
</style>
</head>
<body>
<div id="loading"><div class="loadBox"><div style="font-size:20px;color:var(--accent);font-weight:800">BATTLE ISLE</div><div style="font-size:12px;color:var(--muted);margin-top:8px">Initialisation graphique...</div></div></div>
<div class="hud">
  <div class="left">
    <div class="panel logo">CYBER<span>QUEST</span></div>
    <div class="panel small">Mode: <span id="deviceLabel">Detecting...</span></div>
  </div>
  <div class="right">
    <div class="panel small">Joueur: <b id="playerName">Guest</b></div>
    <div class="panel small">XP: <b id="xp">0</b></div>
  </div>
</div>
<div class="hudBottom">
  <div style="pointer-events:none">
    <div style="font-size:12px;text-align:center;color:var(--muted);margin-bottom:6px">Santé</div>
    <div class="hbar"><div id="hpFill" class="fill" style="width:86%"></div></div>
  </div>
  <div style="pointer-events:none">
    <div style="font-size:12px;text-align:center;color:var(--muted);margin-bottom:6px">Armure</div>
    <div class="hbar"><div id="armFill" class="fill" style="width:40%;background:linear-gradient(90deg,#ffd166,#ff66c4)"></div></div>
  </div>
  <div class="minimap panel" id="miniMap">Mini-map</div>
  <div style="pointer-events:auto"><button id="battleBtn" class="btn btn-primary btn-main btn-large btn" style="padding:10px 18px">BATTLE</button></div>
</div>
<div class="vrToggle" id="vrToggleBar" style="display:none;pointer-events:auto"><button id="enterVr">Entrer VR</button></div>

<!-- Canvas for Three.js will be appended here -->

<script>
// Basic device detection and quality presets
var isQuest=false, isMobile=false, isDesktop=true;
(function(){var ua=navigator.userAgent||'';isQuest=/OculusBrowser|Quest/.test(ua);isMobile=/Mobi|Android|iPhone|iPad/.test(ua);isDesktop=!isMobile&&!isQuest;})();
document.getElementById('deviceLabel').textContent = isQuest? 'Quest 2' : (isMobile? 'Mobile' : 'Desktop');

// Load Three.js (same fallback strategy)
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
(async function(){try{
  await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');
  init();
}catch(e){document.getElementById('loading').style.display='none';alert('Erreur chargement Three.js');}
})();

function init(){
  // Scene, camera, renderer
  var scene=new THREE.Scene();
  var bgColor=0x071827; scene.background=new THREE.Color(bgColor);
  var camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.05,200);
  camera.position.set(0,6,10);
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isQuest?1.2:1.6));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=false;
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

  // Lights
  var sun=new THREE.DirectionalLight(0xffffff,1.0);sun.position.set(5,10,2);scene.add(sun);
  scene.add(new THREE.HemisphereLight(0x66b3ff,0x442233,0.6));

  // Sky gradient using large sphere
  var skyGeo=new THREE.SphereGeometry(80,32,15);
  var skyMat=new THREE.MeshBasicMaterial({side:THREE.BackSide,vertexColors:true});
  // simple vertex colors approximation
  var skyColors=[];for(var i=0;i<skyGeo.attributes.position.count;i++){var v=skyGeo.attributes.position.getY(i);var t=(v+40)/80;skyColors.push(0.03+0.3*(1-t),0.1+0.5*(1-t),0.15+0.5*(1-t));}
  skyGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(skyColors),3));
  scene.add(new THREE.Mesh(skyGeo,skyMat));

  // Low-poly island
  var size=64;var segments=64;var geom=new THREE.PlaneGeometry(size,size,segments,segments);geom.rotateX(-Math.PI/2);
  var pos=geom.attributes.position;
  for(var i=0;i<pos.count;i++){
    var x=pos.getX(i), z=pos.getZ(i);
    var d=Math.sqrt(x*x+z*z);
    var h=Math.max(0, 6 - d*0.6) + (Math.sin(x*0.5+z*0.3)*0.6);
    pos.setY(i,h + (Math.random()-0.5)*0.6);
  }
  geom.computeVertexNormals();
  var mat=new THREE.MeshStandardMaterial({color:0x5dd3ff,flatShading:true,roughness:1,metalness:0});
  var island=new THREE.Mesh(geom,mat);island.receiveShadow=false;scene.add(island);

  // Simple rock pillars
  var rockGeo=new THREE.CylinderGeometry(.6,.8,3,6);var rockMat=new THREE.MeshStandardMaterial({color:0x6b4b9a});
  for(var i=0;i<12;i++){var r=new THREE.Mesh(rockGeo,rockMat);var a=Math.random()*Math.PI*2;var rr=3+Math.random()*10; r.position.set(Math.cos(a)*rr,1.5,Math.sin(a)*rr);r.rotation.y=Math.random()*Math.PI;scene.add(r);} 

  // Particles (sparks/confetti) - reduced for Quest
  var pCount = isQuest ? 80 : 200;
  var pGeo=new THREE.BufferGeometry();var pArr=new Float32Array(pCount*3);
  for(var i=0;i<pCount;i++){pArr[i*3]=(Math.random()-0.5)*20;pArr[i*3+1]=Math.random()*6+1;pArr[i*3+2]=(Math.random()-0.5)*20}
  pGeo.setAttribute('position',new THREE.BufferAttribute(pArr,3));
  var pMat=new THREE.PointsMaterial({color:0xff66c4,size:isQuest?0.06:0.12,transparent:true,opacity:0.9});
  var points=new THREE.Points(pGeo,pMat);scene.add(points);

  // Camera controls (orbit for desktop/mobile)
  var controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.1;controls.target.set(0,1.6,0);

  // HUD interaction: update mini-map canvas
  var mini=document.getElementById('miniMap');
  var miniCanvas=document.createElement('canvas');miniCanvas.width=280;miniCanvas.height=160;mini.appendChild(miniCanvas);var mctx=miniCanvas.getContext('2d');
  function drawMini(){mctx.clearRect(0,0,miniCanvas.width,miniCanvas.height);mctx.fillStyle='#071229';mctx.fillRect(0,0,miniCanvas.width,miniCanvas.height);mctx.fillStyle='#8bd0ff';mctx.beginPath();mctx.arc(140,80,40,0,Math.PI*2);mctx.fill();mctx.fillStyle='#fff';mctx.fillRect(136,76,8,8);}
  drawMini();

  // Battle button simulates a drop-in
  var battleBtn=document.getElementById('battleBtn');battleBtn.addEventListener('click',function(){startBattleSequence();});

  // VR button
  var vrToggle=document.getElementById('vrToggleBar');if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(function(s){if(s)vrToggle.style.display='block';});}
  var enterVr=document.getElementById('enterVr');enterVr.addEventListener('click',async function(){if(renderer.xr && !renderer.xr.isPresenting){try{var s=await navigator.xr.requestSession('immersive-vr');renderer.xr.enabled=true;renderer.xr.setSession(s);}catch(e){alert('VR non disponible');}}});

  // Simple battle animation: camera drops, confetti burst, HUD updates
  function startBattleSequence(){
    document.getElementById('loading').style.display='block';
    var start = performance.now();
    var duration=2200;
    var fromY=camera.position.y, toY=12, fromZ=camera.position.z, toZ=0.5;
    var anim=setInterval(function(){var t=(performance.now()-start)/duration; if(t>=1){clearInterval(anim);document.getElementById('loading').style.display='none';onBattleStart();return;}camera.position.y = fromY + (toY-fromY)*easeOutCubic(t);camera.position.z = fromZ + (toZ-fromZ)*easeOutCubic(t);},16);
    // small confetti burst
    var colors=[0xff66c4,0x5dd3ff,0xffd166,0x8ad166];
    for(var i=0;i<40;i++){var spr=new THREE.Mesh(new THREE.PlaneGeometry(0.12,0.12),new THREE.MeshBasicMaterial({color:colors[i%colors.length]}));spr.position.set((Math.random()-0.5)*6,Math.random()*6+2,(Math.random()-0.5)*6);spr.rotation.x=Math.random()*Math.PI;spr.userData.life=60;scene.add(spr);} 
  }
  function onBattleStart(){// show action HUD and lock camera
    document.getElementById('hpFill').style.width='100%';
    // spawn some temporary targets
    for(var i=0;i<6;i++){var t=new THREE.Mesh(new THREE.SphereGeometry(0.28,10,8),new THREE.MeshStandardMaterial({color:0xffd166}));t.position.set((Math.random()-0.5)*8,0.8,(Math.random()-0.5)*8);scene.add(t);} 
  }
  function easeOutCubic(t){return (--t)*t*t+1;}

  // Animation loop
  var t=0;function animate(){t+=0.01;points.rotation.y = Math.sin(t*.1)*0.02;controls.update();renderer.render(scene,camera);
    // cleanup confetti
    scene.traverse(function(o){if(o.userData&&o.userData.life!==undefined){o.userData.life--; if(o.userData.life<0 && o.parent) o.parent.remove(o);}});
    requestAnimationFrame(animate);}animate();

  // hide loader
  document.getElementById('loading').style.display='none';
}

// small utility: save placeholders for assets
</script>
</body>
</html>
