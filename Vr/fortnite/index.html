<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fortnite Demo (minimal)</title>
  <style>
    html,body{height:100%;margin:0;background:#05121b;color:#eaf8ff;font-family:system-ui,Arial;display:flex;align-items:center;justify-content:center}
    #app{width:100%;height:100%;position:relative;overflow:hidden}
    #ui{position:absolute;top:12px;left:12px;z-index:10}
    button{background:#0b6b9a;color:white;border:0;padding:8px 12px;border-radius:6px;margin-right:8px}
    #profile{display:none;position:absolute;right:12px;top:12px;background:rgba(0,0,0,0.6);padding:12px;border-radius:8px}
    label,input{display:block;margin:6px 0;color:#eaf8ff}
  </style>
</head>
<body>
  <div id="app">
    <div id="ui">
      <button id="battleBtn">BATTLE</button>
      <button id="openProfile">Profile</button>
    </div>
    <div id="profile">
      <label for="pfName">Nom</label>
      <input id="pfName" type="text" placeholder="TonPseudo" />
      <button id="saveProfile">Sauvegarder</button>
    </div>
    <canvas id="c"></canvas>
  </div>

  <script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
    camera.position.z = 3;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    const geo = new THREE.BoxGeometry(1,1,1);
    const mat = new THREE.MeshStandardMaterial({ color: 0x48a9ff, metalness: 0.2, roughness: 0.6 });
    const cube = new THREE.Mesh(geo, mat);
    scene.add(cube);
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5,5,5);
    scene.add(light);
    function onResize(){ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
    addEventListener('resize', onResize);
    function animate(){ cube.rotation.x += 0.01; cube.rotation.y += 0.013; renderer.render(scene, camera); requestAnimationFrame(animate); }
    requestAnimationFrame(animate);
    document.getElementById('battleBtn').addEventListener('click', ()=>{ cube.scale.set(1.6,1.6,1.6); setTimeout(()=>cube.scale.set(1,1,1),600); });
    document.getElementById('openProfile').addEventListener('click', ()=>{ document.getElementById('profile').style.display='block'; });
    document.getElementById('saveProfile').addEventListener('click', ()=>{ const name=document.getElementById('pfName').value||'DemoUser'; localStorage.setItem('pfName',name); document.getElementById('profile').style.display='none'; try{ alert('Profil sauvegardé: '+name); }catch(e){} });
  </script>
</body>
</html>
